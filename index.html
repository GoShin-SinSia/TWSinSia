<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#902E22" />
  <title>神社模擬器</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- 開場：同一分頁只播放一次，獨立於地圖載入 -->
  <button id="site-intro" class="site-intro" type="button" hidden
          aria-label="迷走神界 — Goshin within Shinto Shrines，點擊跳過開場">
    <span class="site-intro-copy">
      <span class="site-intro-title">迷走神界</span>
      <span class="site-intro-subtitle" lang="en">Goshin within Shinto Shrines</span>
    </span>
    <span class="site-intro-hint">點擊任意處跳過</span>
  </button>
  <script src="intro.js"></script>

  <!-- 頂部裝飾紋路 -->
  <div class="top-border-pattern"></div>

  <header class="site-header">
    <div class="header-ornament">✦</div>
    <h1><span class="title-desktop">迷走神界</span><span class="title-mobile">迷走神界</span></h1>
    <div class="header-subtitle-line">
      <span class="line-deco"></span>
      <span class="subtitle-text">穿越時光・尋訪神祇</span>
      <span class="line-deco"></span>
    </div>
    <p class="header-desc">以下36個神社，你曾經去過幾個？</p>
  </header>

  <nav class="page-nav" aria-label="主要導覽">
    <a href="index.html" class="nav-btn" aria-current="page">
      <span class="btn-icon" aria-hidden="true">🗺️</span> 神社地圖
    </a>
    <a href="card.html" class="nav-btn">
      <span class="btn-icon" aria-hidden="true">🎴</span> 集點卡
    </a>
    <a href="card.html?tab=quest" class="nav-btn">
      <span class="btn-icon" aria-hidden="true">🔍</span> 迷走神界
    </a>
  </nav>

  <div class="controls_wrapper">
    <div id="controls">
      <div class="count-row" role="group" aria-label="依社格篩選">

        <button class="count-chip guan" id="showGuan" data-cat="官社" aria-pressed="false">
          <span class="count-icon">🏯</span>
          <span id="guanCount">官社：0</span>
        </button>

        <button class="count-chip xian" id="showXian" data-cat="縣社" aria-pressed="false">
          <span class="count-icon">⛩</span>
          <span id="xianCount">縣社：0</span>
        </button>

        <button class="count-chip xiang" id="showXiang" data-cat="鄉社" aria-pressed="false">
          <span class="count-icon">🏮</span>
          <span id="xiangCount">鄉社：0</span>
        </button>

        <button id="viewAll">
          <span class="btn-icon">⊕</span> 顯示全部神社
        </button>
      </div>

    </div>
  </div>

  <div class="map-frame">
    <div id="map"></div>
  </div>

  <div id="placeModal" class="place-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button id="closeModal" class="close-modal" aria-label="關閉">×</button>

      <h3 id="modalTitle"></h3>

      <div class="photo-tabs" role="group" aria-label="照片">
        <button id="pastBtn" data-mode="past">過去</button>
        <button id="nowBtn" data-mode="now">現在</button>
      </div>

      <div id="modalPhotoTitle" class="photo-title"></div>

      <img id="modalPhoto" class="popup-photo" src="" alt="">
      <div id="modalPhotoCredit" class="photo-credit"></div>

      <div class="popup-info">
        <div class="place-meta">
          <span id="modalCategory" class="place-cat"></span>
          <span id="modalPeriod" class="place-period"></span>
        </div>
        <p class="place-addr">📍 <span id="modalAddress"></span></p>
        <p class="place-desc" id="modalDescription"></p>
      </div>

      <div class="place-actions">
        <a id="modalNav" class="place-act" target="_blank" rel="noopener">🧭 導航過去</a>
        <a href="card.html" class="place-act primary">🎴 去集點卡打卡</a>
      </div>
    </div>
  </div>

  <!-- 底部裝飾 -->
  <div class="footer-pattern"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="csv.js"></script>
  <script src="credits.js"></script>
  <script src="script.js"></script>
</body>
</html>
